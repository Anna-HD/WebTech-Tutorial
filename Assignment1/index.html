<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
    <div class="form-container">
        <h1>login</h1>
        <form action="" id="registration-form">
            <div class="form-group">
                <label for="fullname"> Full Name</label>
                <input type="text"  name="fullname" id="fullname" class="box" placeholder="full name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="box" placeholder="Email" required>
            </div>

            <div class="form-group">
                <h4>Experience Level</h4>
                <select name="experience" id="experience" class="box" required>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <h4>Workshop track</h4>
                <div class="choice">
                    <input type="radio" name="interest" id="frontend" required >
                    <label for="frontend">Frontend</label>
                
                    <input type="radio" name="interest" id="backend" >
                    <label for="backend">Backend</label>
                    
                    <input type="radio" name="interest" id="design" >
                    <label for="design">UI/UX Design</label>
                
                </div>
            </div>

            <div class="form-group">
                <input type="checkbox" id="notification"><label for="notification">Receive notifications</label>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
